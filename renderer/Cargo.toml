[package]
name = "cs80-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skia-safe = { version = "0.157.0", features = ["textlayout", "svg"] }
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
urlencoding = "2"
